# open_rv32m — LibreLane synthesis on IHP SG13G2 (open-source counterpart of dc/)
# Same top and RTL set as dc/scripts/run_dc.tcl. Run: make -C librelane
meta:
  version: 3
  flow: Classic

PDK: ihp-sg13g2
DESIGN_NAME: rv32im_ahb_top

# bus_if.sv is typedef-only and unused by this top (same as DC)
VERILOG_FILES:
  - dir::../rtl/addr_decode.sv
  - dir::../rtl/pc_unit.sv
  - dir::../rtl/regfile.sv
  - dir::../rtl/imm_gen.sv
  - dir::../rtl/decoder.sv
  - dir::../rtl/alu_control.sv
  - dir::../rtl/alu.sv
  - dir::../rtl/muldiv_unit.sv
  - dir::../rtl/forwarding_unit.sv
  - dir::../rtl/hazard_unit.sv
  - dir::../rtl/lsu.sv
  - dir::../rtl/rv32im_core.sv
  - dir::../rtl/rv32im_ahb_dport.sv
  - dir::../rtl/rv32im_ahb_fetch.sv
  - dir::../rtl/rv32im_ahb_top.sv
VERILOG_INCLUDE_DIRS:
  - dir::../rtl
# SystemVerilog frontend (unique case, enums, always_ff)
USE_SLANG: true
# Buffer high-fanout nets in ABC; without it pre-PnR STA is dominated by
# unbuffered fanout (WNS -21.6 ns vs -4.4 ns at 5 ns, slow corner) for +3.6% area
SYNTH_ABC_BUFFERING: true

CLOCK_PORT: hclk
CLOCK_PERIOD: 5.0
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
